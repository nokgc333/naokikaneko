<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0a0a0a" />

  <!-- top label -->
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="15" fill="#777777" text-anchor="middle" letter-spacing="2">WHAT&#8217;S THE DIFFERENCE?</text>

  <!-- centered main row: .md -> .mdx -->
  <g text-anchor="middle">
    <text x="255" y="220" font-family="ui-monospace, monospace" font-size="56" font-weight="700" fill="#888888">.md</text>
    <text x="400" y="212" font-family="Arial, sans-serif" font-size="40" fill="#555555">&#8594;</text>
    <text x="560" y="220" font-family="ui-monospace, monospace" font-size="56" font-weight="700" fill="#ffffff">.mdx</text>
  </g>

  <!-- centered subline -->
  <g text-anchor="middle">
    <text x="255" y="255" font-family="Arial, sans-serif" font-size="17" fill="#777777">Markdown only</text>
    <text x="560" y="255" font-family="Arial, sans-serif" font-size="17" fill="#dddddd">Markdown + JSX</text>
  </g>

  <!-- centered code line -->
  <rect x="220" y="285" width="360" height="1" fill="#333333" />
  <text x="400" y="315" font-family="ui-monospace, monospace" font-size="17" fill="#aaaaaa" text-anchor="middle">&lt;Component /&gt; ✓</text>
</svg>
