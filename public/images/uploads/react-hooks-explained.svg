<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0a0a0a" />

  <!-- top label -->
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="15" fill="#777777" text-anchor="middle" letter-spacing="2">REACT HOOKS CHEAT SHEET</text>

  <!-- centered main title -->
  <text x="400" y="215" font-family="ui-monospace, monospace" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle">useState()</text>

  <!-- orbiting related hooks, kept within safe center zone -->
  <text x="260" y="255" font-family="ui-monospace, monospace" font-size="18" fill="#888888" text-anchor="middle">useEffect</text>
  <text x="540" y="255" font-family="ui-monospace, monospace" font-size="18" fill="#888888" text-anchor="middle">useMemo</text>
  <text x="290" y="285" font-family="ui-monospace, monospace" font-size="18" fill="#666666" text-anchor="middle">useRef</text>
  <text x="510" y="285" font-family="ui-monospace, monospace" font-size="18" fill="#666666" text-anchor="middle">useCallback</text>

  <!-- centered code line -->
  <rect x="220" y="310" width="360" height="1" fill="#333333" />
  <text x="400" y="340" font-family="ui-monospace, monospace" font-size="16" fill="#aaaaaa" text-anchor="middle">const [state, setState] = useState(0)</text>
</svg>
