backend:
  name: github
  repo: nokgc333/naokikaneko
  branch: main
  base_url: https://naokikaneko.vercel.app
  auth_endpoint: api/decap-oauth/auth

local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "work"
    label: "Work"
    folder: "content/work"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "slug", label: "Slug", widget: "string", hint: "URLに使われる（例: my-project）" }
      - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "tags", label: "Tags", widget: "list", required: false, default: [] }
      - { name: "thumbnail", label: "Thumbnail", widget: "image", required: false, hint: "推奨アスペクト比 約2:1の横長画像（表示箇所によって自動でクロップされる。主要な被写体は画像中央に配置する）" }
      - { name: "url", label: "URL", widget: "string", required: false }
      - { name: "description", label: "Description", widget: "string" }
      - { name: "body", label: "Body", widget: "markdown" }

  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{fields.slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "slug", label: "Slug", widget: "string", hint: "URLに使われる（例: my-post）" }
      - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "tags", label: "Tags", widget: "list", required: false, default: [] }
      - { name: "thumbnail", label: "Thumbnail", widget: "image", required: false, hint: "推奨アスペクト比 約2:1の横長画像（表示箇所によって自動でクロップされる。主要な被写体は画像中央に配置する）" }
      - { name: "url", label: "URL", widget: "string", required: false }
      - { name: "description", label: "Description", widget: "string" }
      - { name: "body", label: "Body", widget: "markdown" }
